name: MedAI Guardian CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.10'
  UV_VERSION: '0.4.0'
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-south1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test_secret_key
          GOOGLE_API_KEY: test_key
      
      - name: Run linting
        run: |
          uv run ruff check .
          uv run mypy backend/

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Build Docker image
        run: |
          docker build -f backend/docker/Dockerfile -t gcr.io/${{ env.GCP_PROJECT_ID }}/medai-api:${{ github.sha }} .
          docker tag gcr.io/${{ env.GCP_PROJECT_ID }}/medai-api:${{ github.sha }} gcr.io/${{ env.GCP_PROJECT_ID }}/medai-api:latest
      
      - name: Push to Google Container Registry
        run: |
          gcloud auth configure-docker
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/medai-api:${{ github.sha }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/medai-api:latest
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy medai-api \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/medai-api:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" \
            --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" \
            --set-env-vars "REDIS_URL=${{ secrets.REDIS_URL }}"