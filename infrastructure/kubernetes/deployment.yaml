apiVersion: apps/v1
kind: Deployment
metadata:
  name: medai-api
  namespace: medai
  labels:
    app: medai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medai-api
  template:
    metadata:
      labels:
        app: medai-api
    spec:
      containers:
      - name: api
        image: gcr.io/medai-guardian/medai-api:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: medai-secrets
              key: database_url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: medai-secrets
              key: secret_key
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: medai-secrets
              key: google_api_key
        - name: REDIS_URL
          value: redis://medai-redis:6379/0
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: medai-api-service
  namespace: medai
spec:
  selector:
    app: medai-api
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: medai-secrets
  namespace: medai
type: Opaque
stringData:
  database_url: "postgresql+psycopg://user:pass@postgres-host:5432/medai_db"
  secret_key: "your-secret-key-here"
  google_api_key: "your-google-api-key"